name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  mysql:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.4']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-only
          MYSQL_DATABASE: migration_manager_test_ci
          MYSQL_USER: migration_test
          MYSQL_PASSWORD: test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      MIGRATION_MANAGER_TEST_ALLOW_DESTRUCTIVE: '1'
      MIGRATION_MANAGER_TEST_HOST: 127.0.0.1
      MIGRATION_MANAGER_TEST_PORT: '3306'
      MIGRATION_MANAGER_TEST_DATABASE: migration_manager_test_ci
      MIGRATION_MANAGER_TEST_USERNAME: migration_test
      MIGRATION_MANAGER_TEST_PASSWORD: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mysqlnd, tokenizer, openssl
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - name: Allow test triggers with binary logging
        run: docker exec ${{ job.services.mysql.id }} mysql -uroot -proot-test-only -e "SET GLOBAL log_bin_trust_function_creators=1"
      - name: Configure ephemeral TLS certificates
        run: |
          php tests/Support/create-tls-fixtures.php .test-runtime/tls
          docker cp .test-runtime/tls/server.pem ${{ job.services.mysql.id }}:/var/lib/mysql/ca.pem
          docker cp .test-runtime/tls/server.pem ${{ job.services.mysql.id }}:/var/lib/mysql/server-cert.pem
          docker cp .test-runtime/tls/server-key.pem ${{ job.services.mysql.id }}:/var/lib/mysql/server-key.pem
          docker exec ${{ job.services.mysql.id }} chown mysql:mysql /var/lib/mysql/ca.pem /var/lib/mysql/server-cert.pem /var/lib/mysql/server-key.pem
          docker exec ${{ job.services.mysql.id }} chmod 600 /var/lib/mysql/server-key.pem
          docker exec ${{ job.services.mysql.id }} mysql -uroot -proot-test-only -e "ALTER INSTANCE RELOAD TLS"
          echo "MIGRATION_MANAGER_TEST_TLS_DIR=$GITHUB_WORKSPACE/.test-runtime/tls" >> "$GITHUB_ENV"
      - run: composer test
      - run: composer test:integration
      - run: php tests/consumer.php
